# /data/studyagent/edge/nginx.conf — two TLS identities on :8300 (IP: internal CA; tripo.gz4399.com: public wildcard).
error_log /dev/stderr info;
worker_processes 2;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  access_log /dev/stdout;
  map $http_upgrade $connection_upgrade { default upgrade; "" ""; }
  server {
    listen 8300 ssl default_server;
    server_name _;
    http2 on;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Plain http:// sent to this port is redirected to https://
    error_page 497 =301 https://$host:$server_port$request_uri;
    location = /ca.crt { alias /etc/nginx/ca/ca.crt; default_type application/x-x509-ca-cert; }
    client_max_body_size 8m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_hide_header X-Powered-By;
    location /api/ {
      proxy_pass http://127.0.0.1:14300;
      proxy_set_header Connection "";
      proxy_read_timeout 300s;
      proxy_buffering off;
    }
    location / {
      proxy_pass http://127.0.0.1:13300;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 120s;
    }
  }
  server {
    listen 8300 ssl;
    server_name tripo.gz4399.com;
    http2 on;
    ssl_certificate /etc/nginx/tls/gz4399.crt;
    ssl_certificate_key /etc/nginx/tls/gz4399.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Plain http:// sent to this port is redirected to https://
    error_page 497 =301 https://$host:$server_port$request_uri;
    location = /ca.crt { alias /etc/nginx/ca/ca.crt; default_type application/x-x509-ca-cert; }
    client_max_body_size 8m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_hide_header X-Powered-By;
    location /api/ {
      proxy_pass http://127.0.0.1:14300;
      proxy_set_header Connection "";
      proxy_read_timeout 300s;
      proxy_buffering off;
    }
    location / {
      proxy_pass http://127.0.0.1:13300;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 120s;
    }
  }
}
